name: Deploy Aptis Speaking Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble and validate website package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat bundle/part-*.bin > /tmp/aptis-site.zip
          unzip -t /tmp/aptis-site.zip >/dev/null
          unzip -q /tmp/aptis-site.zip -d public
          test -s public/index.html
          test -s public/assets/app.js
          test -s public/snapshot.js
          cp config.js public/config.js
          test "$(find public/assets -name 'card-*-part-*.png' | wc -l)" -eq 33
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
